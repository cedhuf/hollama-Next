<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="stylesheet" href="/fonts/inter/inter.css" />
		<link rel="stylesheet" href="/fonts/jetbrains-mono/jetbrains-mono.css" />
		<!-- Fit the device width, and take the whole of it: `viewport-fit=cover` puts the
		     web view under the status bar and the home indicator instead of beside them, so
		     those strips belong to the app rather than to the OS. That is the only way they
		     can follow the theme, carry the wallpaper, or be anything other than one flat
		     colour decided once at launch. The price is that every edge now has to say what
		     it owes the notch, which is what the `env(safe-area-inset-*)` insets do.
		     Zoom is disabled for a stable, native feel; the 16px input rule also blocks the
		     iOS focus-zoom. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<!-- Installable PWA + iOS standalone (fullscreen, status bar drawn over the app). -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#242424" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<!-- The one value that puts the app under the status bar rather than beside it.
		     It moves the document up without growing the layout viewport, which is what
		     leaves the notorious white bar along the bottom; the document is given the
		     full height of the display in the stylesheet to fill it. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Llooma" />
		<title>Llooma</title>
		%sveltekit.head%
	</head>
	<script>
		// We check and apply the color theme preference on initial load
		// to prevent a flash of unstyled content.
		let settings = JSON.parse(localStorage.getItem('llooma-settings'));
		let themeMode = settings?.themeMode;
		let themeStyle = settings?.themeStyle;
		let theme;
		if (themeMode === 'dark') theme = 'dark';
		else if (themeMode === 'light') theme = 'light';
		else theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
		if (themeStyle) document.documentElement.setAttribute('data-theme-style', themeStyle);
		document.documentElement.setAttribute('data-color-theme', theme);
		// Tint the browser/OS chrome (Android address bar, iOS Safari) to match the
		// app's safe-area chrome (shade-1), so the notch / status strip blends in.
		// Refined live after hydration to follow the active theme style.
		const themeColorMeta = document.querySelector('meta[name="theme-color"]');
		if (themeColorMeta) themeColorMeta.content = theme === 'dark' ? '#242424' : '#f5f5f5';
	</script>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
