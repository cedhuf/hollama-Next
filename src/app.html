<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="stylesheet" href="/fonts/inter/inter.css" />
		<link rel="stylesheet" href="/fonts/jetbrains-mono/jetbrains-mono.css" />
		<!-- Fit the device width. We deliberately do NOT use viewport-fit=cover, so iOS keeps the
		     web view inside the safe area on its own (status bar + home indicator handled by the OS) —
		     no manual safe-area insets anywhere, and the keyboard is left to native handling. Zoom is
		     disabled for a stable, native feel; the 16px input rule also blocks the iOS focus-zoom. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<!-- Installable PWA + iOS standalone (fullscreen, status bar drawn over the app). -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#242424" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Llooma" />
		<title>Llooma</title>
		%sveltekit.head%
	</head>
	<script>
		// We check and apply the color theme preference on initial load
		// to prevent a flash of unstyled content.
		// This runs before any module, so on the first load after the rename the
		// settings still sit under the old key — read it as a fallback, or the
		// theme would flash exactly once, on the update everyone notices.
		// TODO (rename cleanup): drop the fallback with the other one-shot
		// migrations — see adoptLegacyDatabase in src/lib/server/db/index.ts.
		let settings = JSON.parse(
			localStorage.getItem('llooma-settings') ?? localStorage.getItem('hollamanext-settings')
		);
		let themeMode = settings?.themeMode;
		let themeStyle = settings?.themeStyle;
		let theme;
		if (themeMode === 'dark') theme = 'dark';
		else if (themeMode === 'light') theme = 'light';
		else theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
		if (themeStyle) document.documentElement.setAttribute('data-theme-style', themeStyle);
		document.documentElement.setAttribute('data-color-theme', theme);
		// Tint the browser/OS chrome (Android address bar, iOS Safari) to match the
		// app's safe-area chrome (shade-1), so the notch / status strip blends in.
		// Refined live after hydration to follow the active theme style.
		const themeColorMeta = document.querySelector('meta[name="theme-color"]');
		if (themeColorMeta) themeColorMeta.content = theme === 'dark' ? '#242424' : '#f5f5f5';
	</script>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
