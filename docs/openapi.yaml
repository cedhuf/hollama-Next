openapi: 3.1.0

info:
  title: Llooma HTTP API
  version: 0.6.0
  summary: The endpoints Llooma's own interface talks to in server mode.
  description: |
    This API exists to serve the Llooma web client. It is documented so the
    behaviour is auditable and so a self-hosted instance can be scripted, not
    because it is a stable public contract — it changes with the interface.

    Everything here requires an authenticated session unless a path says
    otherwise, and `/api` is exempt from the page-level auth guard, so each
    endpoint checks the session itself.

    Endpoints are marked `x-status: todo` until their request and response
    shapes have been written down. The surface itself (paths and methods) is
    checked against the routes in CI by `scripts/check-api-docs.mjs`.
servers:
  - url: http://localhost:5173
    description: Development server
  - url: https://your-llooma-instance
    description: Your instance
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: Session cookie issued by Auth.js on sign-in.
security:
  - session: []
paths:
  /api/admin/config:
    get:
      tags: [admin]
      summary: TODO
      x-status: todo
      responses:
        '200': { description: TODO }
    put:
      tags: [admin]
      summary: TODO
      x-status: todo
      responses:
        '200': { description: TODO }
  /api/admin/personas:
    put:
      tags: [admin]
      summary: Publish the personas an admin wrote and flagged shared
      description: >
        The body is the complete answer to "which of my personas are shared", so
        it replaces the list. What the instance relays from the store is a
        separate list of ids and is untouched.
      responses:
        '204': { description: Published. }
        '400': { description: The body is not an array. }
  /api/admin/personas/store/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: The persona's id in the store's listing.
    put:
      tags: [admin]
      summary: Relay one of the store's personas to this instance's users
      description: >
        A reference, not a copy: nothing is installed and nothing is snapshotted,
        so the catalogue keeps listing it once and users install the store's own
        bundle.
      responses:
        '204': { description: Relayed. }
    delete:
      tags: [admin]
      summary: Stop relaying one
      description: Copies people have already installed are theirs and are not touched.
      responses:
        '204': { description: No longer relayed. }
