  /api/metadata:
    get:
      tags: [metadata]
      summary: TODO
      x-status: todo
      responses:
        '200': { description: TODO }
  /api/store/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema: { type: string }
        description: Catch-all segment; may contain slashes.
    get:
      tags: [store]
      summary: Read the persona and playbook store on the instance's behalf
      description: >
        Pass-through to the store (`PERSONA_STORE_URL`, defaulting to the public
        one), so an instance fetches once for all its users and a browser with no
        way out still gets a catalogue. Responses are held briefly, and a held
        copy is served when the store is unreachable.
      responses:
        '200':
          description: The store's listing, or one persona or playbook bundle, verbatim.
          content:
            application/json: { schema: { type: object } }
  /api/playbooks/config:
    get:
      tags: [playbooks]
      summary: The playbooks this instance publishes
      responses:
        '200':
          description: The instance's playbooks and whether they are locked.
          content:
            application/json: { schema: { type: object } }
  /api/admin/playbooks:
    put:
      tags: [admin]
      summary: Replace the instance's playbooks
      responses:
        '200': { description: Saved. }
  /api/admin/playbooks/store/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [admin]
      summary: Install a playbook from the store
      responses:
        '200': { description: Installed. }
    delete:
      tags: [admin]
      summary: Remove an installed playbook
      responses:
        '204': { description: Removed. }
  /api/images:
    get:
      tags: [images]
      summary: Everything this account has drawn
      description: Metadata only, newest first. The pictures themselves are fetched one at a time.
      responses:
        '200':
          description: The gallery index.
          content:
            application/json: { schema: { type: object } }
    post:
      tags: [images]
      summary: Draw something
      description: >
        Long, and deliberately not a job queue: the work happens in the server and
        what it produces is written to the gallery before this answers, so a tab
        that closes halfway through loses the response and nothing else.
      responses:
        '200': { description: The pictures that were made. }
        '400': { description: Missing or unusable parameters. }
        '403': { description: The connection is not this account's, or is disabled. }
  /api/images/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [images]
      summary: Rename a picture
      responses:
        '200': { description: Saved. }
    delete:
      tags: [images]
      summary: Forget one picture
      responses:
        '204': { description: Deleted. }
  /api/images/{id}/blob:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [images]
      summary: The picture itself
      description: >
        Authenticated, like everything else: the file is not served from a public
        path.
      responses:
        '200': { description: The image bytes. }
        '404': { description: No such picture for this account. }
  /api/images/export:
    get:
      tags: [images]
      summary: Every picture, as one archive
      responses:
        '200': { description: A zip of the gallery. }
  /api/transcribe:
    post:
      tags: [voice]
      summary: What was just said, as words
      description: >
        Multipart in, one line of text out. Nothing is kept: the recording exists
        for the length of this request and the text goes into a composer the
        person reads before sending it. The connection is resolved and the key
        injected here, so the browser never learns either.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [serverId, model, audio]
              properties:
                serverId: { type: string }
                model: { type: string }
                audio: { type: string, format: binary }
                language:
                  type: string
                  description: >
                    ISO 639-1, optional. Sent on to the provider only where its
                    endpoint is known to take one. Absent means the model works
                    it out, which it does well on a sentence and badly on three
                    words.

      responses:
        '200':
          description: The transcript.
          content:
            application/json:
              schema:
                type: object
                properties: { text: { type: string } }
        '400': { description: Missing parameters, or nothing was recorded. }
        '402': { description: Over the credit ceiling, or an unpriced model while one is in force. }
        '413': { description: The recording is larger than the provider accepts. }
        '415': { description: An audio type this app does not send. }
        '504': { description: The provider took longer than this app is willing to wait. }
  /api/speak:
    post:
      tags: [voice]
      summary: A sentence, as sound
      description: >
        JSON in, audio bytes out, and nothing kept at either end. The sound exists
        for the length of the response and is played from a blob the page drops
        when it is done; there is deliberately no cache, since caching would mean
        writing down what somebody was told. The connection is resolved and the
        key injected here, so the browser never learns either.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serverId, model, voice, text]
              properties:
                serverId: { type: string }
                model: { type: string }
                voice: { type: string, description: A voice name the provider knows. }
                text: { type: string, description: One piece, within the app's own ceiling. }
      responses:
        '200':
          description: The audio, in whatever playable type the provider answered with.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        '400': { description: Missing parameters, no voice, or a model that does not read aloud. }
        '402': { description: Over the credit ceiling, or an unpriced model while one is in force. }
        '413': { description: More text than this app will send in one piece. }
        '502':
          { description: The provider could not be reached, or answered with something unplayable. }
        '504': { description: The provider took longer than this app is willing to wait. }
    get:
      tags: [voice]
      summary: The voices one model offers
      description: >
        An empty list is a real answer: it means this connection publishes no
        names, and the setting asks for one to be typed instead.
      parameters:
        - { name: serverId, in: query, required: true, schema: { type: string } }
        - { name: model, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: The voice names, possibly none.
          content:
            application/json:
              schema:
                type: object
                properties:
                  voices: { type: array, items: { type: string } }
  /api/usage:
    get:
      tags: [usage]
      summary: What this account has spent, and what it is allowed
      responses:
        '200':
          description: The period, the spend, the ceiling and thirty days of history.
          content:
            application/json: { schema: { type: object } }
  /api/personas/config:
    get:
      tags: [personas]
      summary: TODO
      x-status: todo
      responses:
        '200': { description: TODO }
  /api/providers:
    get:
      tags: [providers]
      summary: TODO
      x-status: todo
      responses:
        '200': { description: TODO }
  /api/runs:
    get:
      tags: [runs]
      summary: The generation still running for a conversation, if there is one.
      description: >
        What a page asks on load so it can pick a turn back up. Returns null when
        the conversation has nothing in flight and nothing recent to collect. Only
        a run still running is worth joining: a finished one has already written
        what it produced into the conversation.
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: A run summary, or null. }
    post:
      tags: [runs]
      summary: Start a generation that outlives the page that asked for it.
      description: >
        Returns as soon as the run has an identity, not when the model has
        answered: the turn then belongs to the server, which writes what it
        produces into the conversation, and the client follows it over the event
        stream to draw it. A client never has to store what a run produced, and
        must not: the stream is what the turn looks like, not where it is kept.
        The conversation must already exist, which is what makes the question
        older than the answer. Answers 409 with the existing run when the
        conversation already has one going.
      responses:
        '201': { description: The run that was started. }
        '404': { description: No such conversation. }
        '409': { description: That conversation is already generating. }
  /api/runs/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [runs]
      summary: Stop a generation.
      description: >
        Whatever the model had already written still comes back through the
        stream, as an ending rather than as nothing.
      responses:
        '200': { description: The run, now cancelled. }
  /api/runs/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: from
        in: query
        required: false
        schema: { type: integer }
    get:
      tags: [runs]
      summary: Follow a generation, from wherever the client left off.
      description: >
        Server-sent events. Every event carries its sequence number, so a client
        that reconnects sends Last-Event-ID and receives exactly what it missed;
        `from=0` replays the whole log, which is what a freshly loaded page wants.
        A finished run replays its log and closes.
      responses:
        '200': { description: A text/event-stream of run events. }
  /api/search/config:
    get:
      tags: [search]
      summary: TODO
      x-status: todo
      responses:
        '200': { description: TODO }
  /api/search/sessions:
    get:
      tags: [search]
      summary: TODO
      x-status: todo
      responses:
        '200': { description: TODO }
  /api/servers:
    post:
      tags: [servers]
      summary: TODO
      x-status: todo
      responses:
        '200': { description: TODO }
  /api/servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [servers]
      summary: TODO
      x-status: todo
      responses:
        '200': { description: TODO }
    delete:
      tags: [servers]
      summary: TODO
      x-status: todo
      responses:
        '200': { description: TODO }
  /api/servers/verify:
    post:
      tags: [servers]
      summary: TODO
      x-status: todo
      responses:
        '200': { description: TODO }
  /api/prompts/config:
    get:
      tags: [prompts]
      summary: The system prompt and the app's own instructions, resolved for the caller
      x-status: todo
      responses:
        '200': { description: TODO }
  /api/mcp:
    get:
      tags: [mcp]
      summary: The caller's own MCP servers, without their tokens
      responses:
        '200': { description: The list, oldest first. }
    post:
      tags: [mcp]
      summary: Add one
      description: |
        Refused with 403 unless the caller is an administrator or the instance
        has opened MCP servers to accounts, and with 409 past the per-account
        ceiling. The address has to be http or https: HTTP streamable is the
        only transport, and stdio is deliberately absent.
      responses:
        '201': { description: Added. }
        '400': { description: Not a usable address. }
        '403': { description: Not open to this account. }
        '409': { description: Too many already. }
  /api/mcp/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [mcp]
      summary: One of them
      responses:
        '200': { description: The server. }
        '404': { description: No such server, or not the caller's. }
    put:
      tags: [mcp]
      summary: Save an edit
      description: |
        An absent field is left alone. `secret` omitted keeps the stored token,
        `secret: ""` clears it. Renaming can change the slug the tools are named
        after, so the answer carries the record as stored.
      responses:
        '200': { description: Saved. }
        '404': { description: No such server, or not the caller's. }
    delete:
      tags: [mcp]
      summary: Remove it
      responses:
        '204': { description: Gone. }
  /api/mcp/config:
    get:
      tags: [mcp]
      summary: Whether this account may add MCP servers, and how many
      responses:
        '200': { description: The permission and the ceiling. }
  /api/mcp/verify:
    post:
      tags: [mcp]
      summary: Connect to a server and list its tools, without storing anything
      description: |
        Send a `url`, with a `secret` when the server wants one, or an `id` to
        re-test a stored server without typing its token again. Answers
        `{ ok: true, tools, total }`, or `{ ok: false, error }` with the reason
        in a sentence.
      responses:
        '200': { description: The verdict, whichever way it went. }
        '404': { description: An id that is not the caller's. }
  /api/admin/mcp:
    get:
      tags: [admin]
      summary: Every MCP server on the instance, with whose it is
      responses:
        '200': { description: The roster. }
  /api/admin/mcp/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [admin]
      summary: Suspend one, or lift the suspension
      description: |
        Takes `{ blocked }` and nothing else. An administrator never edits
        somebody else's address or token, and never touches the owner's own
        switch.
      responses:
        '200': { description: The server as it now stands. }
        '404': { description: No such server. }
    delete:
      tags: [admin]
      summary: Remove somebody's server
      responses:
        '204': { description: Gone. }
