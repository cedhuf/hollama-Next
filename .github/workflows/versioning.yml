name: Version & release

on:
  workflow_dispatch:

jobs:
  version:
    name: Run semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

  image:
    name: Publish the release image
    needs: version
    # `main` rather than a fixed SHA: it resolves at checkout time, so it picks up
    # the `chore(release)` commit semantic-release has just pushed — the one that
    # carries the new version number into the image.
    uses: ./.github/workflows/build.yml
    with:
      ref: main
    permissions:
      contents: read
      packages: write

  docs:
    name: Publish the documentation
    needs: version
    # Same `main`, and for the same reason: the site reads the version out of the
    # checkout. Alongside the image rather than after it, since neither needs the
    # other and a twenty-minute multi-arch build is no reason to keep the
    # documentation waiting.
    uses: ./.github/workflows/docs.yml
    with:
      ref: main
    permissions:
      contents: read
      pages: write
      id-token: write
