name: Build & publish

# Images are published per release, not per push: a multi-arch build takes ~20
# minutes, and `:latest` is only meaningful if the version it carries is the one
# `package.json` was tagged with. Use "Run workflow" to publish from `main`
# without cutting a release.
#
# "Run workflow" also takes any other branch, and publishes it as `:nightly`
# instead. That is how a working branch gets an image people can try without it
# claiming to be the release.
on:
  workflow_dispatch:
  # Called by `versioning.yml` once a release lands. A commit pushed by an Action
  # using the default GITHUB_TOKEN never triggers another workflow, so the release
  # commit would otherwise leave `:latest` on the previous version number.
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build. Defaults to the triggering ref.
        type: string
        required: false
        default: ''

# A second run supersedes the first rather than racing it to the registry.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `inputs.ref` is only set when called from another workflow, where
          # `github.sha` still points at the caller's commit — the one *before*
          # the release bump.
          ref: ${{ inputs.ref || github.ref }}

      # Read from the checkout rather than from the event: on a `workflow_call`,
      # `github.sha` is the caller's commit, not the one being built.
      # The branch decides which tags this build may claim. Anything that is not
      # `main` publishes `:nightly` and its commit, and nothing else. `:latest` has
      # to keep meaning "the last release", and the version in `package.json` on a
      # working branch is whatever `main` released last, so pushing it from here
      # would replace a published image with different code under the same name.
      - name: Read the build's identity
        id: meta
        run: |
          branch="${{ inputs.ref || github.ref_name }}"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$branch" = "main" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.release == 'true'
              && format('ghcr.io/{0}/llooma:latest', github.repository_owner)
              || format('ghcr.io/{0}/llooma:nightly', github.repository_owner) }}
            ${{ steps.meta.outputs.release == 'true'
              && format('ghcr.io/{0}/llooma:{1}', github.repository_owner, steps.meta.outputs.version)
              || '' }}
            ghcr.io/${{ github.repository_owner }}/llooma:${{ steps.meta.outputs.sha }}
