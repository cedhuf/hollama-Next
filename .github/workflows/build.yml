name: Build & publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Called by `versioning.yml` once a release lands. A commit pushed by an Action
  # using the default GITHUB_TOKEN never triggers another workflow, so the release
  # commit would otherwise leave `:latest` on the previous version number.
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build. Defaults to the triggering ref.
        type: string
        required: false
        default: ''

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `inputs.ref` is only set when called from another workflow, where
          # `github.sha` still points at the caller's commit — the one *before*
          # the release bump.
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hollama:latest
            ghcr.io/${{ github.repository_owner }}/hollama:${{ github.sha }}
