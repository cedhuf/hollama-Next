name: Build & publish

# Images are published per release, not per push: a multi-arch build takes ~20
# minutes, and `:latest` is only meaningful if the version it carries is the one
# `package.json` was tagged with. Use "Run workflow" to publish from `main`
# without cutting a release.
on:
  workflow_dispatch:
  # Called by `versioning.yml` once a release lands. A commit pushed by an Action
  # using the default GITHUB_TOKEN never triggers another workflow, so the release
  # commit would otherwise leave `:latest` on the previous version number.
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build. Defaults to the triggering ref.
        type: string
        required: false
        default: ''

# A second run supersedes the first rather than racing it to the registry.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `inputs.ref` is only set when called from another workflow, where
          # `github.sha` still points at the caller's commit — the one *before*
          # the release bump.
          ref: ${{ inputs.ref || github.ref }}

      # Read from the checkout rather than from the event: on a `workflow_call`,
      # `github.sha` is the caller's commit, not the one being built.
      - name: Read the build's identity
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/llooma:latest
            ghcr.io/${{ github.repository_owner }}/llooma:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/llooma:${{ steps.meta.outputs.sha }}
