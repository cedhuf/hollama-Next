name: Documentation

# Published when a release is cut, and otherwise on request.
#
# It used to publish on every push to `main` that touched the docs, which sounds
# right and is not: the documentation describes the code, so it changes in the
# same commits the code does, and publishing it on push meant the site described
# a version nobody could install yet. Tying it to the release makes the two
# always agree, and gives the changelog page the release it is meant to list,
# since `versioning.yml` calls this after `semantic-release` has published it.
#
# `workflow_dispatch` stays, for fixing a typo without cutting a version.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build. Defaults to the triggering ref.
        type: string
        required: false
        default: ''
  workflow_dispatch:

# One publication at a time, and never cancel one in flight: a half-deployed site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      # `inputs.ref` is only set when called from another workflow, where
      # `github.sha` still points at the caller's commit — the one *before* the
      # release bump, so the version the site shows would be the previous one.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      # The app's own dependencies, for one reason: its `prepare` script runs
      # `svelte-kit sync`, which generates `.svelte-kit/tsconfig.json`. The root
      # `tsconfig.json` extends that generated file, and Astro's resolver reads
      # the root config on its way up, so without this the docs build fails on a
      # clean checkout with "Tsconfig not found", while working on any machine
      # where the app has been built once.
      - name: Install the app (generates .svelte-kit/tsconfig.json)
        run: pnpm install --frozen-lockfile

      # `docs/` is its own pnpm project with its own lockfile, see
      # `docs/pnpm-workspace.yaml` for why it is kept out of the app's workspace.
      - name: Install the docs
        run: pnpm --dir docs install --frozen-lockfile

      # The token is only here so the changelog's build-time call to the releases
      # API is authenticated: a shared runner IP can otherwise be out of
      # unauthenticated quota before the build even starts.
      - name: Build
        run: pnpm --dir docs run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
