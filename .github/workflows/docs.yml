name: Documentation

# Published on every push to `main` that touches the docs, the API routes or the
# OpenAPI spec — the spec is rendered into the site, so a route change that
# updates it has to reach the published pages too.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/routes/api/**'
      - 'scripts/api-routes.mjs'
      - 'scripts/check-api-docs.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# One publication at a time, and never cancel one in flight: a half-deployed site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      # The app's own dependencies, for one reason: its `prepare` script runs
      # `svelte-kit sync`, which generates `.svelte-kit/tsconfig.json`. The root
      # `tsconfig.json` extends that generated file, and Astro's resolver reads
      # the root config on its way up — so without this the docs build fails on a
      # clean checkout with "Tsconfig not found", while working on any machine
      # where the app has been built once.
      - name: Install the app (generates .svelte-kit/tsconfig.json)
        run: pnpm install --frozen-lockfile

      # `docs/` is its own pnpm project with its own lockfile — see
      # `docs/pnpm-workspace.yaml` for why it is kept out of the app's workspace.
      - name: Install the docs
        run: pnpm --dir docs install --frozen-lockfile

      - name: Build
        run: pnpm --dir docs run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
