name: ESLint

on:
  pull_request:

jobs:
  lint:
    name: Run linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
