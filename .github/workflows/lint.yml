name: ESLint

on:
  pull_request:

jobs:
  lint:
    name: Run linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

      # Fails when an API route exists that `docs/openapi.yaml` does not describe,
      # or the reverse. Catches the endpoint nobody documented, which is the drift
      # that actually happens.
      - name: Check the API documentation is in step with the routes
        run: pnpm run check:api

      # Fails when a persona bundle was added or edited without regenerating the
      # store's listing. The listing is what the app reads, so a stale one means a
      # persona that exists in the repository and not in the store.
      - name: Check the persona store listing is in step with its bundles
        run: pnpm run personas:check

      - name: Check the playbook store listing is in step with its bundles
        run: pnpm run playbooks:check
